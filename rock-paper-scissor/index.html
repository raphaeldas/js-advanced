<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Painting</title>
    <style>
        html, body {
            margin: 0;
        }

        #webcam {
            width: 100%;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: transparent;
        }

        #container {
            display: flex;
            justify-content: space-around;
            width: calc(100% - 2em);
            padding: 1em;
        }
    </style>
</head>

<body>
    <video id="webcam"></video>
    <div id="container">
        <div class="left">
            <h2>Player 1</h2>
            <p id="player1"></p>
        </div>
        <div class="right">
            <h2>Player 2</h2>
            <p id="player2"></p>
        </div>
    </div>
    <script src="https://unpkg.com/ml5@1/dist/ml5.js"></script>
    <script type="module">
        console.log('Hello World!');
        let stream, videoWidth;
        const videoElem = document.querySelector('video');
        const player1 = {
            'moveHand': 'left',
            'moveElem': document.querySelector('#player1'),
            'startMoveMaxDistance': null,
            'startMoveMinDistance': null
        };
        const player2 = {
            'moveHand': 'right',
            'moveElem': document.querySelector('#player2'),
            'startMoveMaxDistance': null,
            'startMoveMinDistance': null
        };

        let gameStarted = false;
        let startMoves = 3;

        const handPose = ml5.handPose({
            maxHands: 4,
            runtime: 'mediapipe',
            flipped: true
        });

        function gotHands(results, error) {
            if (error) console.error(error);
            if (results.length === 0) return;
            // console.log(results);

            // distances tips to wrist:
            // if distance tip <-> wrist is shorter than MCP <-> wrist 4 times -> stone
            // if distance tip <-> wrist is shorter than MCP <-> wrist 2 times -> scissor
            // if distance tip <-> wrist is longer than MCP <-> wrist 4 times -> paper

            for (const hand of results) {
                if (hand.confidence < 0.8) return;
                const fingers = ['index', 'middle', 'ring', 'pinky'];
                const x1 = hand.wrist.x;
                const y1 = hand.wrist.y;

                let tipLonger = 0;

                for (const finger of fingers) {
                    const tip = hand[`${finger}_finger_tip`];
                    const pip = hand[`${finger}_finger_pip`];

                    const x2 = tip.x;
                    const y2 = tip.y;
                    const distanceTipWrist = Math.hypot(x2 - x1, y2 - y1);

                    const x3 = pip.x;
                    const y3 = pip.y;
                    const distancePipWrist = Math.hypot(x3 - x1, y3 - y1);

                    if (distanceTipWrist > distancePipWrist) {
                        tipLonger++;
                    }
                }

                // console.log(tipLonger);


                if (!gameStarted) {
                    // wait until game is started (rock, paper, scissor, shoot)
                    
                    startMoves--;
                    if (startMoves === 1) {
                        gameStarted = true;
                    }
                } else {
                    // detect move for 10 intervals and set winner
                }

                const player = (hand.wrist.x > videoWidth / 2) ? player1.moveElem : player2.moveElem;
                if (tipLonger < 2) {
                    player.textContent = 'Stone';
                } else if (tipLonger > 2) {
                    player.textContent = 'Paper';
                } else {
                    player.textContent = 'Scissor';
                }
            }
        }

        async function startWebcam() {
            stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    width: 1280,
                    height: 720
                }
            });

            videoElem.srcObject = stream;
            videoElem.onloadedmetadata = () => {
                videoElem.play();
                videoWidth = videoElem.videoWidth;
            }

            console.log(handPose, videoElem);
            handPose.detectStart(videoElem, gotHands);
        }

        function startGame() {
            player1.textContent = '';
            player2.textContent = '';
        }

        if (!document.hidden) startWebcam();

        document.addEventListener("visibilitychange", async () => {
            if (document.hidden) {
                console.log('window blurred');
                handPose.detectStop();
                videoElem.pause();
                stream.getTracks().forEach(track => {
                    track.stop();
                });
            } else {
                console.log('window focused');
                startWebcam();
                startGame();
            }
        });
    </script>
</body>

</html>
