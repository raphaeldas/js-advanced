<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        #map {
            height: 580px;
        }

        button, textarea {
            margin: 1em;
        }

        textarea {
            width: calc(100% - 2em);
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <button id="locate">Locate me</button>
    <button id="track">Track me</button><br>
    <textarea name="logs" id="" rows="10"></textarea>
    <script>
        const map = new L.Map('map', {
            crs: L.CRS.EPSG3857,
            continuousWorld: true,
            worldCopyJump: false,
            minZoom: 7.5
        });
        const url = 'https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg';
        // const url = 'https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg';
        const tilelayer = new L.tileLayer(url);
        map.addLayer(tilelayer);
        map.setView(L.latLng(46.57591, 7.84956), 7.5);

        const logs = document.querySelector('textarea[name=logs]');

        const locateButton = document.querySelector('#locate');
        locateButton.addEventListener('click', () => {
            navigator.geolocation.getCurrentPosition(position => {
                // console.log(position);
                L.circle([position.coords.latitude, position.coords.longitude], {
                    radius: 2000,
                }).addTo(map);
                map.setView(L.latLng(position.coords.latitude, position.coords.longitude), 11);
                logs.textContent += `Location ${position.coords.latitude} lat, ${position.coords.longitude} long\n`;
                logs.scrollTop = logs.scrollHeight;
            }, error => {
                console.error('error:', error);
            }, { enableHighAccuracy: true });
        });

        let tracker;
        const trackLine = L.polyline([], { color: 'red', weight: 5, opacity: 0.5 }).addTo(map);
        const trackButton = document.querySelector('#track');
        trackButton.addEventListener('click', () => {
            if (trackButton.textContent === 'Track me') {
                trackButton.textContent = 'Stop tracking';
                tracker = navigator.geolocation.watchPosition(position => {
                    // console.log(position);
                    trackLine.addLatLng([position.coords.latitude, position.coords.longitude]);
                    logs.textContent += `Track Location ${position.coords.latitude} lat, ${position.coords.longitude} long\n`;
                    logs.scrollTop = logs.scrollHeight;
                }, error => {
                    console.error('error:', error);
                }, { enableHighAccuracy: true });
            } else {
                trackButton.textContent = 'Track me';
                navigator.geolocation.clearWatch(tracker);
            }
        });

    </script>
</body>

</html>
