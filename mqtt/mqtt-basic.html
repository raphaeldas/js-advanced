<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT Basic Example</title>
</head>

<body>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script>
        console.log(mqtt);

        // https://www.emqx.com/en/blog/mqtt-js-tutorial
        // https://mqtt-explorer.com/ for inspecting mqtt broker and messages
        

        /***
         * Browser
         * This document explains how to use MQTT over WebSocket with the ws and wss protocols.
         * EMQX's default port for ws connection is 8083 and for wss connection is 8084.
         * Note that you need to add a path after the connection address, such as /mqtt.
         */
        const url = 'ws://broker.emqx.io:8083/mqtt'

        // Create an MQTT client instance
        const options = {
            // Clean session
            clean: true,
            connectTimeout: 4000,
            // Authentication
            clientId: 'emqx_test',
            username: 'emqx_test',
            password: 'emqx_test',
        }
        const client = mqtt.connect(url, options)
        client.on('connect', function () {
            console.log('Connected')
            // Subscribe to a topic
            client.subscribe('test', function (err) {
                if (!err) {
                    // Publish a message to a topic
                    client.publish('test', 'Hello mqtt')
                }
            })
        })

        // Receive messages
        client.on('message', function (topic, message) {
            // message is Buffer
            console.log(message.toString())
            client.end()
        })


    </script>
</body>

</html>
