<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Painting</title>
    <style>
        #webcam {
            position: absolute;
            width: 200px;
            right: 1em;
            z-index: 100;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            background-color: transparent;
        }
    </style>
</head>

<body>
    <video id="webcam"></video>
    <canvas id="canvas"></canvas>
    <script src="https://unpkg.com/ml5@1/dist/ml5.js"></script>
    <script type="module">
        console.log('Hello World!');
        let stream;
        const videoElem = document.querySelector('video');
        const canvasElem = document.querySelector('canvas');
        const ctx = canvasElem.getContext('2d');

        canvasElem.width = window.innerWidth;
        canvasElem.height = window.innerHeight;

        ctx.fillStyle = 'red';
        // ctx.beginPath();
        // ctx.arc(10, 10, 10, 0, 2 * Math.PI);
        // ctx.fill();

        let smoothPointer = [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }];
        let smoothPointerIndex = 0;

        const handPose = await ml5.handPose({
            runtime: 'mediapipe',
            flipped: true
        });

        function paint(tip) {
            const smoothLength = smoothPointer.length;

            const xPercent = tip.x / videoElem.videoWidth;
            const yPercent = tip.y / videoElem.videoHeight;

            smoothPointer[smoothPointerIndex] = { x: xPercent, y: yPercent };
            smoothPointerIndex = (smoothPointerIndex + 1) % smoothLength;

            const xNew = smoothPointer.reduce((acc, val) => acc + val.x, 0) / smoothLength;
            const yNew = smoothPointer.reduce((acc, val) => acc + val.y, 0) / smoothLength;

            ctx.beginPath();
            ctx.arc(canvasElem.width * xNew, canvasElem.height * yNew, 10, 0, 2 * Math.PI);
            ctx.fill();

            console.log(tip, xPercent, yPercent);
        }

        function gotHands(results, error) {
            if (error) console.error(error);
            // console.log(results);
            if (results.length === 0) return;
            console.log(results);

            for (const hand of results) {
                const indexPosition = hand.index_finger_tip;

                console.log(`${hand.handedness} hand, index: ${indexPosition.x}, ${indexPosition.y}`);
                paint(indexPosition);
            }

        }

        async function startWebcam() {
            stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    width: 1280,
                    height: 720
                }
            });
    
            videoElem.srcObject = stream;
            videoElem.onloadedmetadata = () => {
                videoElem.play();
            }
    
            console.log(handPose, videoElem);
            handPose.detectStart(videoElem, gotHands);
        }

        if (!document.hidden) startWebcam();

        document.addEventListener("visibilitychange", async () => {
            if (document.hidden) {
                console.log('window blurred');
                handPose.detectStop();
                videoElem.pause();
                stream.getTracks().forEach(track => {
                    track.stop();
                });
            } else {
                console.log('window focused');
                startWebcam();
            }
        });
    </script>
</body>

</html>
